kind: vars
vars:
  WINDOWS_ISO: "/path/to/windows11.iso"
  VIRTIO_ISO: "/path/to/virtio-win.iso"
---
kind: instance
name: windows11
vm: true
empty: true
config:
  limits.cpu: "4"
  limits.memory: 6GiB
  security.secureboot: "true"
  image.os: Windows11
devices:
  root:
    path: /
    pool: default
    type: disk
    size: 60GiB
    io.bus: nvme
  tpm:
    type: tpm
  install:
    type: disk
    source: $WINDOWS_ISO
    boot.priority: "10"
    io.bus: usb
  virtio:
    type: disk
    source: $VIRTIO_ISO
    boot.priority: "5"
    io.bus: usb
  agent:
    type: disk
    source: agent:config
description: Windows 11
