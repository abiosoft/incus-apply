kind: vars
vars:
  ISO_FILE: "/path/to/IncusOS.iso"
---
kind: instance
name: incus-os
vm: true
empty: true
config:
  limits.cpu: "4"
  limits.memory: 4GiB
  security.secureboot: "false"
devices:
  root:
    path: /
    pool: default
    type: disk
    size: 60GiB
  tpm:
    type: tpm
  install:
    type: disk
    source: $ISO_FILE
    boot.priority: "10"
description: IncusOS
